<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Pedidos Públicos - Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100">
    <div id="navbar"></div>
    <div id="sidebar-container"></div>

    <main class="lg:ml-64 pt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Header -->
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-gray-900">Pré-Pedidos Públicos</h2>
                <p class="text-gray-600 mt-2">Analise e aprove pedidos recebidos pelo catálogo público</p>
            </div>

            <!-- Cards de Estatísticas -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">Pendentes</p>
                            <p id="card-pendentes" class="text-2xl font-bold text-yellow-600">0</p>
                        </div>
                        <div class="bg-yellow-100 p-3 rounded-full">
                            <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">Em Análise</p>
                            <p id="card-analise" class="text-2xl font-bold text-blue-600">0</p>
                        </div>
                        <div class="bg-blue-100 p-3 rounded-full">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">Aprovados Hoje</p>
                            <p id="card-aprovados" class="text-2xl font-bold text-green-600">0</p>
                        </div>
                        <div class="bg-green-100 p-3 rounded-full">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">Expirados</p>
                            <p id="card-expirados" class="text-2xl font-bold text-red-600">0</p>
                        </div>
                        <div class="bg-red-100 p-3 rounded-full">
                            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h3 class="text-lg font-semibold mb-4">Filtros</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                        <select id="filter-status" onchange="carregarPrePedidos()" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="PENDENTE,EM_ANALISE">Pendentes e Em Análise</option>
                            <option value="PENDENTE">Apenas Pendentes</option>
                            <option value="EM_ANALISE">Apenas Em Análise</option>
                            <option value="APROVADO">Aprovados</option>
                            <option value="REJEITADO">Rejeitados</option>
                            <option value="EXPIRADO">Expirados</option>
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data Início</label>
                        <input type="date" id="filter-data-inicio" onchange="carregarPrePedidos()" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data Fim</label>
                        <input type="date" id="filter-data-fim" onchange="carregarPrePedidos()" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                </div>
            </div>

            <!-- Lista de Pré-Pedidos -->
            <div id="pre-pedidos-container" class="space-y-4">
                <div class="text-center py-12">
                    <div class="spinner mx-auto mb-4"></div>
                    <p class="text-gray-600">Carregando pré-pedidos...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Análise -->
    <div id="modal-analise" class="modal-backdrop hidden">
        <div class="bg-white rounded-lg shadow-xl w-[calc(100vw-1rem)] sm:w-full max-w-6xl mx-2 sm:mx-4 max-h-[95vh] sm:max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 z-10 flex justify-between items-center px-4 sm:px-6 py-4 border-b bg-blue-50">
                <h3 class="text-xl font-bold text-gray-900">Análise de Pré-Pedido</h3>
                <button onclick="fecharModalAnalise()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="analise-content" class="p-4 sm:p-6"></div>
        </div>
    </div>

    <!-- Modal Rejeitar -->
    <div id="modal-rejeitar" class="modal-backdrop hidden">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h3 class="text-lg font-semibold text-gray-900">Rejeitar Pré-Pedido</h3>
                <button onclick="fecharModalRejeitar()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="form-rejeitar" class="px-6 py-4" onsubmit="confirmarRejeicao(event)">
                <input type="hidden" id="rejeitar-id">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Motivo da Rejeição*</label>
                    <textarea id="motivo-rejeicao" required rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Explique o motivo da rejeição..."></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="fecharModalRejeitar()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Rejeitar Pedido</button>
                </div>
            </form>
        </div>
    </div>

    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg">
            <div class="spinner mx-auto"></div>
            <p class="mt-4 text-gray-700">Processando...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/session-manager.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/services/filtros.js"></script>
    <script src="../js/services/pre-pedidos.js"></script>
    <script src="../js/services/clientes.js"></script>
    <script src="../js/services/pedidos.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/sidebar.js"></script>
    
    <script>
        let currentUser = null;
        let prePedidos = [];
        let prePedidoEmAnaliseId = null;
        let opcoesItensPrePedido = [];
        let opcoesClientesPrePedido = [];

        (async () => {
            await checkAuth();
            currentUser = await getCurrentUser();
            
            // Verificar permissões
            if (!['VENDEDOR', 'COMERCIAL', 'APROVADOR', 'ADMIN'].includes(currentUser.role)) {
                showToast('Acesso negado', 'error');
                redirect('/pages/dashboard.html');
                return;
            }

            document.getElementById('navbar').innerHTML = createNavbar();
            document.getElementById('sidebar-container').innerHTML = createSidebar();
            await initNavbar();
            await initSidebar();

            // Restaurar filtros salvos
            const filtrosSalvos = filtroPrePedidos.recuperarFiltros();
            if (filtrosSalvos) {
                document.getElementById('filter-status').value = filtrosSalvos.status || 'PENDENTE,EM_ANALISE';
                document.getElementById('filter-data-inicio').value = filtrosSalvos.dataInicio || '';
                document.getElementById('filter-data-fim').value = filtrosSalvos.dataFim || '';
            }

            await carregarPrePedidos();
            
            // Atualizar a cada 30 segundos
            setInterval(carregarPrePedidos, 30000);
        })();

        async function carregarPrePedidos() {
            try {
                // Expirar pedidos vencidos
                await expirarPrePedidosAntigos();

                const filtros = {};
                const status = document.getElementById('filter-status').value;
                const dataInicio = document.getElementById('filter-data-inicio').value;
                const dataFim = document.getElementById('filter-data-fim').value;

                if (status) {
                    filtros.status = status.includes(',') ? status.split(',') : status;
                }
                if (dataInicio) filtros.dataInicio = dataInicio;
                if (dataFim) filtros.dataFim = dataFim + 'T23:59:59';

                // Salvar filtros no sessionStorage
                filtroPrePedidos.salvarFiltros({
                    status,
                    dataInicio,
                    dataFim
                });

                prePedidos = await listarPrePedidos(filtros);
                
                atualizarCards();
                renderizarPrePedidos();
            } catch (error) {
                handleError(error, 'Erro ao carregar pré-pedidos');
            }
        }

        function atualizarCards() {
            const pendentes = prePedidos.filter(p => p.status === 'PENDENTE').length;
            const emAnalise = prePedidos.filter(p => p.status === 'EM_ANALISE').length;
            
            const hoje = new Date().toISOString().split('T')[0];
            const aprovados = prePedidos.filter(p => 
                p.status === 'APROVADO' && p.data_analise?.startsWith(hoje)
            ).length;
            
            const expirados = prePedidos.filter(p => p.status === 'EXPIRADO').length;

            document.getElementById('card-pendentes').textContent = pendentes;
            document.getElementById('card-analise').textContent = emAnalise;
            document.getElementById('card-aprovados').textContent = aprovados;
            document.getElementById('card-expirados').textContent = expirados;
        }

        function podeReativarPrePedido(prePedido) {
            return prePedido.status === 'EXPIRADO' && !prePedido.pedido_gerado_id;
        }

        function renderizarPrePedidos() {
            const container = document.getElementById('pre-pedidos-container');

            if (prePedidos.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow p-12 text-center">
                        <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                        <p class="text-gray-600 text-lg">Nenhum pré-pedido encontrado</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = prePedidos.map(pp => {
                const statusColor = {
                    'PENDENTE': 'bg-yellow-100 text-yellow-800',
                    'EM_ANALISE': 'bg-blue-100 text-blue-800',
                    'APROVADO': 'bg-green-100 text-green-800',
                    'REJEITADO': 'bg-red-100 text-red-800',
                    'EXPIRADO': 'bg-gray-100 text-gray-800'
                }[pp.status] || 'bg-gray-100 text-gray-800';

                const tempoRestante = calcularTempoRestante(pp.data_expiracao);
                const expiracaoBadge = tempoRestante.expirado
                    ? '<span class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-medium">Expirado</span>'
                    : `<span class="px-3 py-1 bg-orange-100 text-orange-800 rounded-full text-sm font-medium">Expira em ${tempoRestante.texto}</span>`;

                const itensResumo = pp.pre_pedido_itens.slice(0, 3).map(item =>
                    `• ${item.produto.nome}${item.sabor ? ' - ' + item.sabor.sabor : ''}: ${item.quantidade} un.`
                ).join('<br>');
                const maisItens = pp.pre_pedido_itens.length > 3 
                    ? `<br>... e mais ${pp.pre_pedido_itens.length - 3} iten(s)`
                    : '';

                return `
                    <div class="bg-white rounded-lg shadow hover:shadow-md transition p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900">${pp.numero}</h3>
                                <p class="text-gray-700 font-medium">${pp.nome_solicitante}</p>
                                ${pp.email_contato ? `<p class="text-sm text-gray-500">${pp.email_contato}</p>` : ''}
                                ${pp.telefone_contato ? `<p class="text-sm text-gray-500">${pp.telefone_contato}</p>` : ''}
                            </div>
                            <div class="text-right space-y-2">
                                <span class="px-3 py-1 ${statusColor} rounded-full text-sm font-medium">${pp.status}</span>
                                ${['PENDENTE', 'EM_ANALISE'].includes(pp.status) ? expiracaoBadge : ''}
                            </div>
                        </div>

                        <div class="border-t border-b py-4 my-4">
                            <p class="text-sm font-medium text-gray-700 mb-2">Itens solicitados (${pp.pre_pedido_itens.length}):</p>
                            <p class="text-sm text-gray-600">${itensResumo}${maisItens}</p>
                        </div>

                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-sm text-gray-500">Solicitado em ${formatDateTime(pp.created_at)}</p>
                                <p class="text-2xl font-bold text-blue-600 mt-1">${formatCurrency(pp.total)}</p>
                            </div>
                            <div class="flex space-x-2">
                                ${pp.status === 'PENDENTE' || pp.status === 'EM_ANALISE' ? `
                                    <button onclick="analisarPrePedido('${pp.id}')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                                        Analisar
                                    </button>
                                    <button onclick="abrirModalRejeitar('${pp.id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                                        Rejeitar
                                    </button>
                                ` : pp.status === 'APROVADO' && pp.pedido_gerado_id ? `
                                    <a href="/pages/venda-detalhe.html?id=${pp.pedido_gerado_id}" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                                        Ver Pedido
                                    </a>
                                ` : podeReativarPrePedido(pp) ? `
                                    <button onclick="reativarPrePedidoExpirado('${pp.id}')" class="px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition">
                                        Reativar
                                    </button>
                                    <button onclick="analisarPrePedido('${pp.id}')" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                                        Ver Detalhes
                                    </button>
                                ` : `
                                    <button onclick="analisarPrePedido('${pp.id}')" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                                        Ver Detalhes
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /**
         * Buscar cliente automaticamente por email, telefone ou nome
         */
        async function buscarClienteAutomatico(prePedido) {
            try {
                const clientes = await getClientes();
                
                // 1. Buscar por email (mais confiável)
                if (prePedido.email_contato) {
                    const porEmail = clientes.find(c => 
                        c.email && c.email.toLowerCase() === prePedido.email_contato.toLowerCase()
                    );
                    if (porEmail) {
                        return { ...porEmail, motivo: 'Correspondência por email' };
                    }
                }
                
                // 2. Buscar por telefone/WhatsApp
                if (prePedido.telefone_contato) {
                    const telefone = prePedido.telefone_contato.replace(/\D/g, '');
                    const porTelefone = clientes.find(c => {
                        const contatoCliente = (c.contato || '').replace(/\D/g, '');
                        const whatsappCliente = (c.whatsapp || '').replace(/\D/g, '');
                        return contatoCliente === telefone || whatsappCliente === telefone;
                    });
                    if (porTelefone) {
                        return { ...porTelefone, motivo: 'Correspondência por telefone' };
                    }
                }
                
                // 3. Buscar por similaridade de nome (caso tenha telefone/email mas não exato)
                if (prePedido.email_contato || prePedido.telefone_contato) {
                    const nomePedido = prePedido.nome_solicitante.toLowerCase().trim();
                    const porNome = clientes.find(c => 
                        c.nome.toLowerCase().trim() === nomePedido
                    );
                    if (porNome) {
                        return { ...porNome, motivo: 'Correspondência por nome exato' };
                    }
                }
                
                return null;
            } catch (error) {
                console.error('Erro ao buscar cliente automático:', error);
                return null;
            }
        }

        async function analisarPrePedido(id) {
            try {
                showLoading(true);
                prePedidoEmAnaliseId = id;

                // Marcar como em análise se ainda estiver pendente
                const pp = prePedidos.find(p => p.id === id);
                if (pp.status === 'PENDENTE') {
                    await marcarEmAnalise(id);
                }

                const prePedido = await obterPrePedido(id);
                const validacao = await validarEstoquePrePedido(id);
                const clientes = await getClientes();
                opcoesItensPrePedido = await listarOpcoesItensPrePedido();
                opcoesClientesPrePedido = clientes || [];
                
                // Buscar cliente automaticamente
                const clienteSugerido = await buscarClienteAutomatico(prePedido);

                // Pode gerar se estiver pendente ou em análise
                const podeGerar = prePedido.status === 'PENDENTE' || prePedido.status === 'EM_ANALISE';

                const itensHtml = prePedido.pre_pedido_itens.map(item => {
                    const val = validacao.validacoes.find(v => v.item_id === item.id);
                    const statusIcon = val.status === 'OK' ? '✅' : val.status === 'ALERTA' ? '⚠️' : '❌';
                    const statusColor = val.status === 'OK' ? 'text-green-600' : val.status === 'ALERTA' ? 'text-yellow-600' : 'text-red-600';
                    const estoqueAtual = val.estoque_atual || 0;

                    return `
                        <tr class="border-b">
                            <td class="py-3 px-4">
                                ${podeGerar ? `
                                    <div class="min-w-[320px] relative">
                                        <label class="block text-[11px] font-semibold uppercase tracking-wide text-gray-500 mb-1">Produto / Sabor</label>
                                        <input type="hidden" id="pre-item-produto-valor-${item.id}" value="${getProdutoPrePedidoValue(item)}">
                                        <input type="text" id="pre-item-produto-${item.id}" value="${getProdutoPrePedidoLabel(item)}" onfocus="openProdutoPrePedidoDropdown('${item.id}')" onclick="openProdutoPrePedidoDropdown('${item.id}')" oninput="handleProdutoPrePedidoInput('${item.id}')" onblur="handleProdutoPrePedidoBlur('${item.id}')" class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Digite para pesquisar produto ou sabor" autocomplete="off">
                                        <div id="pre-item-produto-dropdown-${item.id}" class="hidden absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl border border-gray-200 bg-white shadow-lg">
                                            ${buildOpcoesProdutoPrePedido(item)}
                                        </div>
                                        <p class="text-[11px] text-gray-400 mt-1">Pesquise escrevendo o nome do produto ou sabor.</p>
                                    </div>
                                ` : `
                                    <p class="font-medium">${item.produto.nome}</p>
                                    ${item.sabor ? `<p class="text-sm text-gray-600">${item.sabor.sabor}</p>` : ''}
                                `}
                            </td>
                            <td class="py-3 px-4 text-center">
                                ${podeGerar ? `
                                    <div class="w-28 mx-auto">
                                        <label class="block text-[11px] font-semibold uppercase tracking-wide text-gray-500 mb-1 text-left">Quantidade</label>
                                        <input type="number" id="pre-item-qtd-${item.id}" min="1" step="1" value="${item.quantidade}" class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-center shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    </div>
                                ` : item.quantidade}
                            </td>
                            <td class="py-3 px-4 text-right">
                                ${podeGerar ? `
                                    <div class="w-32 ml-auto">
                                        <label class="block text-[11px] font-semibold uppercase tracking-wide text-gray-500 mb-1 text-left">Preço Unit.</label>
                                        <input type="number" id="pre-item-preco-${item.id}" min="0.01" step="0.01" value="${item.preco_unitario}" class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-right shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    </div>
                                ` : formatCurrency(item.preco_unitario)}
                            </td>
                            <td class="py-3 px-4 text-right font-medium">${formatCurrency(item.subtotal)}</td>
                            <td class="py-3 px-4 text-center ${statusColor}">
                                ${statusIcon} ${val.mensagem}
                            </td>
                            ${podeGerar ? `
                                <td class="py-3 px-4 text-right whitespace-nowrap">
                                    <button onclick="salvarItemPrePedidoAnalise('${item.id}', ${estoqueAtual})" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">
                                        Salvar
                                    </button>

        async function gerarPedidoVendaModal(prePedidoId) {

                        </button>

        async function salvarNovoItemPrePedidoAnalise() {
            const quantidade = parseFloat(getPrePedidoQuantidadeInput('novo')?.value);
            const preco = parseFloat(getPrePedidoPrecoInput('novo')?.value);
            const produtoValor = getPrePedidoProdutoHidden('novo')?.value;
            const produtoInput = getPrePedidoProdutoInput('novo');
            const selectedOption = getOpcaoProdutoPrePedidoById(produtoValor) || resolveProdutoPrePedidoOption(produtoInput?.value);

            if (!prePedidoEmAnaliseId) {
                showToast('Abra um pre-pedido para adicionar itens.', 'warning');
                return;
            }

            if (!Number.isFinite(quantidade) || !Number.isFinite(preco) || quantidade <= 0 || preco <= 0) {
                showToast('Quantidade e preco devem ser maiores que zero.', 'warning');
                return;
            }

            if (!selectedOption) {
                showToast('Selecione um produto valido.', 'warning');
                return;
            }

            const estoqueSelecionado = parseFloat(selectedOption.estoque || 0);
            if (estoqueSelecionado <= 0) {
                showToast('Este produto/sabor esta sem estoque disponivel.', 'warning');
                return;
            }

            if (quantidade > estoqueSelecionado) {
                showToast(`Quantidade maior que o estoque disponivel (${estoqueSelecionado}).`, 'warning');
                return;
            }

            try {
                showLoading(true);
                await adicionarItemPrePedido(prePedidoEmAnaliseId, {
                    produto_id: selectedOption.produtoId,
                    sabor_id: selectedOption.saborId,
                    quantidade,
                    preco_unitario: preco,
                    estoque_disponivel_momento: estoqueSelecionado
                });
                await analisarPrePedido(prePedidoEmAnaliseId);
                await carregarPrePedidos();
                showToast('Item adicionado ao pre-pedido com sucesso!', 'success');
            } catch (error) {
                handleError(error, 'Erro ao adicionar item ao pre-pedido');
            } finally {
                showLoading(false);
            }
        }

        async function salvarItemPrePedidoAnalise(itemId, estoqueAtual) {
            const quantidade = parseFloat(getPrePedidoQuantidadeInput(itemId)?.value);
            const preco = parseFloat(getPrePedidoPrecoInput(itemId)?.value);
            const produtoValor = getPrePedidoProdutoHidden(itemId)?.value;
            const produtoInput = getPrePedidoProdutoInput(itemId);
            const selectedOption = getOpcaoProdutoPrePedidoById(produtoValor) || resolveProdutoPrePedidoOption(produtoInput?.value);

            if (quantidade <= 0 || preco <= 0) {
                showToast('Quantidade e preço devem ser maiores que zero.', 'warning');
                return;
            }

            if (!selectedOption) {
                showToast('Selecione um produto válido.', 'warning');
                return;
            }

            const produtoId = selectedOption.produtoId;
            const saborId = selectedOption.saborId;
            const estoqueSelecionado = parseFloat(selectedOption.estoque || estoqueAtual || 0);

            try {
                showLoading(true);
                await atualizarItemPrePedido(itemId, {
                    produto_id: produtoId,
                    sabor_id: saborId,
                    quantidade,
                    preco_unitario: preco,
                    estoque_disponivel_momento: estoqueSelecionado
                });
                await analisarPrePedido(prePedidoEmAnaliseId);
                await carregarPrePedidos();
                showToast('Item do pré-pedido atualizado com sucesso!', 'success');
            } catch (error) {
                handleError(error, 'Erro ao atualizar item do pré-pedido');
            } finally {
                showLoading(false);
            }
        }

        function buildOpcoesProdutoPrePedido(item, options = {}) {
            const opcoes = options.somenteComEstoque
                ? opcoesItensPrePedido.filter(opcao => parseFloat(opcao.quantidade || 0) > 0)
                : opcoesItensPrePedido;

            if (opcoes.length === 0) {
                return '<div class="px-3 py-3 text-sm text-gray-500">Nenhum produto com estoque disponivel.</div>';
            }

            return opcoes.map(opcao => {
                const selected = item.sabor_id
                    ? opcao.id === item.sabor_id
                    : opcao.produto?.id === item.produto?.id;
                const label = getOpcaoProdutoPrePedidoLabel(opcao);

                return `
                    <button
                        type="button"
                        onclick="selecionarProdutoPrePedido('${item.id}', '${opcao.id}')"
                        data-produto-opcao="true"
                        data-label="${label}"
                        class="w-full px-3 py-2 text-left hover:bg-blue-50 border-b border-gray-100 last:border-b-0"
                    >
                        <div class="text-sm font-medium text-gray-800">${label}</div>
                        <div class="text-xs text-gray-500">Estoque: ${parseFloat(opcao.quantidade || 0)} | Preço: ${formatCurrency(parseFloat(opcao.produto?.preco_venda || opcao.produto?.preco || 0))}</div>
                    </button>
                `;
            }).join('');
        }

        function getOpcaoProdutoPrePedidoLabel(opcao) {
            return `${opcao.produto?.nome || 'Produto'} - ${opcao.sabor || 'Sem sabor'}`;
        }

        function isElementVisible(element) {
            return !!(element && element.offsetParent !== null);
        }

        function isMobilePrePedidoItemActive(itemId) {
            return isElementVisible(document.getElementById(`pre-item-produto-mobile-${itemId}`));
        }

        function getPrePedidoProdutoInput(itemId) {
            return isMobilePrePedidoItemActive(itemId)
                ? document.getElementById(`pre-item-produto-mobile-${itemId}`) || document.getElementById(`pre-item-produto-${itemId}`)
                : document.getElementById(`pre-item-produto-${itemId}`) || document.getElementById(`pre-item-produto-mobile-${itemId}`);
        }

        function getPrePedidoProdutoHidden(itemId) {
            return isMobilePrePedidoItemActive(itemId)
                ? document.getElementById(`pre-item-produto-valor-mobile-${itemId}`) || document.getElementById(`pre-item-produto-valor-${itemId}`)
                : document.getElementById(`pre-item-produto-valor-${itemId}`) || document.getElementById(`pre-item-produto-valor-mobile-${itemId}`);
        }

        function getPrePedidoProdutoDropdown(itemId) {
            return isMobilePrePedidoItemActive(itemId)
                ? document.getElementById(`pre-item-produto-dropdown-mobile-${itemId}`) || document.getElementById(`pre-item-produto-dropdown-${itemId}`)
                : document.getElementById(`pre-item-produto-dropdown-${itemId}`) || document.getElementById(`pre-item-produto-dropdown-mobile-${itemId}`);
        }

        function getPrePedidoPrecoInput(itemId) {
            return isMobilePrePedidoItemActive(itemId)
                ? document.getElementById(`pre-item-preco-mobile-${itemId}`) || document.getElementById(`pre-item-preco-${itemId}`)
                : document.getElementById(`pre-item-preco-${itemId}`) || document.getElementById(`pre-item-preco-mobile-${itemId}`);
        }

        function getPrePedidoQuantidadeInput(itemId) {
            return isMobilePrePedidoItemActive(itemId)
                ? document.getElementById(`pre-item-qtd-mobile-${itemId}`) || document.getElementById(`pre-item-qtd-${itemId}`)
                : document.getElementById(`pre-item-qtd-${itemId}`) || document.getElementById(`pre-item-qtd-mobile-${itemId}`);
        }

        function getProdutoPrePedidoValue(item) {
            return item.sabor_id || '';
        }

        function getProdutoPrePedidoLabel(item) {
            return `${item.produto?.nome || 'Produto'} - ${item.sabor?.sabor || 'Sem sabor'}`;
        }

        function getOpcaoProdutoPrePedidoById(saborId) {
            if (!saborId) {
                return null;
            }

            const opcao = opcoesItensPrePedido.find(item => item.id === saborId);
            if (!opcao) {
                return null;
            }

            return {
                produtoId: opcao.produto?.id || null,
                saborId: opcao.id || null,
                preco: parseFloat(opcao.produto?.preco_venda || opcao.produto?.preco || 0),
                estoque: parseFloat(opcao.quantidade || 0),
                label: getOpcaoProdutoPrePedidoLabel(opcao)
            };
        }

        function normalizeProdutoPrePedidoText(value) {
            return (value || '').trim().toLowerCase();
        }

        function getProdutoPrePedidoSelectedLabel(itemId) {
            const hidden = getPrePedidoProdutoHidden(itemId);
            const selected = getOpcaoProdutoPrePedidoById(hidden?.value);
            return selected?.label || '';
        }

        function resolveProdutoPrePedidoOption(label) {
            const normalizedLabel = normalizeProdutoPrePedidoText(label);
            if (!normalizedLabel) {
                return null;
            }

            const opcao = opcoesItensPrePedido.find(item =>
                getOpcaoProdutoPrePedidoLabel(item).trim().toLowerCase() === normalizedLabel
            );

            if (!opcao) {
                return null;
            }

            return {
                produtoId: opcao.produto?.id || null,
                saborId: opcao.id || null,
                preco: parseFloat(opcao.produto?.preco_venda || opcao.produto?.preco || 0),
                estoque: parseFloat(opcao.quantidade || 0),
                label: getOpcaoProdutoPrePedidoLabel(opcao)
            };
        }

        function openProdutoPrePedidoDropdown(itemId) {
            closeAllProdutoPrePedidoDropdowns(itemId);
            const input = getPrePedidoProdutoInput(itemId);
            const selectedLabel = getProdutoPrePedidoSelectedLabel(itemId);
            if (input && normalizeProdutoPrePedidoText(input.value) === normalizeProdutoPrePedidoText(selectedLabel)) {
                input.dataset.previousLabel = selectedLabel;
                input.value = '';
            }
            const dropdown = getPrePedidoProdutoDropdown(itemId);
            if (dropdown) {
                dropdown.classList.remove('hidden');
            }
            filterProdutoPrePedidoDropdown(itemId, true);
        }

        function handleProdutoPrePedidoInput(itemId) {
            const input = getPrePedidoProdutoInput(itemId);
            const hidden = getPrePedidoProdutoHidden(itemId);
            const selectedLabel = getProdutoPrePedidoSelectedLabel(itemId);

            if (!input || !hidden) {
                return;
            }

            if (normalizeProdutoPrePedidoText(input.value) !== normalizeProdutoPrePedidoText(selectedLabel)) {
                hidden.value = '';
            }

            filterProdutoPrePedidoDropdown(itemId);
        }

        function handleProdutoPrePedidoBlur(itemId) {
            window.setTimeout(() => {
                const input = getPrePedidoProdutoInput(itemId);
                const hidden = getPrePedidoProdutoHidden(itemId);
                if (!input || !hidden) {
                    return;
                }

                if (!input.value.trim()) {
                    const selected = getOpcaoProdutoPrePedidoById(hidden.value);
                    input.value = selected?.label || input.dataset.previousLabel || '';
                }

                delete input.dataset.previousLabel;
                closeProdutoPrePedidoDropdown(itemId);
            }, 150);
        }

        function closeProdutoPrePedidoDropdown(itemId) {
            const dropdown = getPrePedidoProdutoDropdown(itemId);
            if (dropdown) {
                dropdown.classList.add('hidden');
            }
        }

        function closeAllProdutoPrePedidoDropdowns(exceptItemId = null) {
            document.querySelectorAll('[id^="pre-item-produto-dropdown-"]').forEach(dropdown => {
                if (exceptItemId && dropdown.id === `pre-item-produto-dropdown-${exceptItemId}`) {
                    return;
                }
                dropdown.classList.add('hidden');
            });
        }

        function filterProdutoPrePedidoDropdown(itemId, forceShowAll = false) {
            const input = getPrePedidoProdutoInput(itemId);
            const dropdown = getPrePedidoProdutoDropdown(itemId);

            if (!input || !dropdown) {
                return;
            }

            const valorAtual = input.value || '';
            const selectedLabel = getProdutoPrePedidoSelectedLabel(itemId);
            const isCurrentSelection = normalizeProdutoPrePedidoText(valorAtual) === normalizeProdutoPrePedidoText(selectedLabel);
            const termo = forceShowAll || isCurrentSelection
                ? ''
                : normalizeProdutoPrePedidoText(valorAtual);
            const botoes = dropdown.querySelectorAll('button[data-produto-opcao]');
            let encontrou = false;

            botoes.forEach(botao => {
                const label = (botao.dataset.label || '').toLowerCase();
                const visible = !termo || label.includes(termo);
                botao.style.display = visible ? '' : 'none';
                if (visible) {
                    encontrou = true;
                }
            });

            let emptyState = dropdown.querySelector('[data-empty-state]');
            if (!emptyState) {
                emptyState = document.createElement('div');
                emptyState.dataset.emptyState = 'true';
                emptyState.className = 'px-3 py-3 text-sm text-gray-500';
                emptyState.textContent = 'Nenhum produto encontrado para a pesquisa.';
                dropdown.appendChild(emptyState);
            }

            emptyState.style.display = encontrou ? 'none' : '';
            dropdown.classList.remove('hidden');
        }

        function selecionarProdutoPrePedido(itemId, saborId) {
            const input = getPrePedidoProdutoInput(itemId);
            const hidden = getPrePedidoProdutoHidden(itemId);
            const precoInput = getPrePedidoPrecoInput(itemId);
            const selected = getOpcaoProdutoPrePedidoById(saborId);

            if (!input || !hidden || !selected) {
                return;
            }

            input.value = selected.label;
            hidden.value = selected.saborId;
            delete input.dataset.previousLabel;

            const desktopInput = document.getElementById(`pre-item-produto-${itemId}`);
            const mobileInput = document.getElementById(`pre-item-produto-mobile-${itemId}`);
            const desktopHidden = document.getElementById(`pre-item-produto-valor-${itemId}`);
            const mobileHidden = document.getElementById(`pre-item-produto-valor-mobile-${itemId}`);
            if (desktopInput) desktopInput.value = selected.label;
            if (mobileInput) mobileInput.value = selected.label;
            if (desktopHidden) desktopHidden.value = selected.saborId;
            if (mobileHidden) mobileHidden.value = selected.saborId;

            const preco = parseFloat(selected.preco || 0);
            if (preco > 0) {
                precoInput.value = preco;
                const desktopPreco = document.getElementById(`pre-item-preco-${itemId}`);
                const mobilePreco = document.getElementById(`pre-item-preco-mobile-${itemId}`);
                if (desktopPreco) desktopPreco.value = preco;
                if (mobilePreco) mobilePreco.value = preco;
            }

            closeProdutoPrePedidoDropdown(itemId);
        }

        function getClientePrePedidoLabel(cliente) {
            if (!cliente) {
                return '';
            }

            return `${cliente.nome} - ${cliente.contato || cliente.whatsapp || cliente.email || 'Sem contato'}`;
        }

        function normalizeClientePrePedidoText(value) {
            return (value || '').trim().toLowerCase();
        }

        function buildOpcoesClientePrePedido() {
            return opcoesClientesPrePedido.map(cliente => {
                const label = getClientePrePedidoLabel(cliente);
                const busca = [
                    cliente.nome,
                    cliente.contato,
                    cliente.whatsapp,
                    cliente.email
                ].filter(Boolean).join(' ').toLowerCase();

                return `
                    <button
                        type="button"
                        onclick="selecionarClientePrePedido('${cliente.id}')"
                        data-cliente-opcao="true"
                        data-label="${label}"
                        data-search="${busca}"
                        class="w-full px-3 py-2 text-left hover:bg-blue-50 border-b border-gray-100 last:border-b-0"
                    >
                        <div class="text-sm font-medium text-gray-800">${cliente.nome}</div>
                        <div class="text-xs text-gray-500">${cliente.contato || cliente.whatsapp || cliente.email || 'Sem contato'}</div>
                    </button>
                `;
            }).join('');
        }

        function getClientePrePedidoById(clienteId) {
            if (!clienteId) {
                return null;
            }

            return opcoesClientesPrePedido.find(cliente => cliente.id === clienteId) || null;
        }

        function resolveClientePrePedidoOption(label) {
            const normalizedLabel = normalizeClientePrePedidoText(label);
            if (!normalizedLabel) {
                return null;
            }

            return opcoesClientesPrePedido.find(cliente =>
                normalizeClientePrePedidoText(getClientePrePedidoLabel(cliente)) === normalizedLabel
            ) || null;
        }

        function openClientePrePedidoDropdown() {
            const input = document.getElementById('select-cliente-busca');
            const hidden = document.getElementById('select-cliente');
            const selected = getClientePrePedidoById(hidden?.value);

            if (input && selected && normalizeClientePrePedidoText(input.value) === normalizeClientePrePedidoText(getClientePrePedidoLabel(selected))) {
                input.dataset.previousLabel = getClientePrePedidoLabel(selected);
                input.value = '';
            }

            const dropdown = document.getElementById('select-cliente-dropdown');
            if (dropdown) {
                dropdown.classList.remove('hidden');
            }

            filterClientePrePedidoDropdown(true);
        }

        function closeClientePrePedidoDropdown() {
            const dropdown = document.getElementById('select-cliente-dropdown');
            if (dropdown) {
                dropdown.classList.add('hidden');
            }
        }

        function handleClientePrePedidoInput() {
            const input = document.getElementById('select-cliente-busca');
            const hidden = document.getElementById('select-cliente');
            const selected = getClientePrePedidoById(hidden?.value);
            const selectedLabel = selected ? getClientePrePedidoLabel(selected) : '';

            if (!input || !hidden) {
                return;
            }

            if (normalizeClientePrePedidoText(input.value) !== normalizeClientePrePedidoText(selectedLabel)) {
                hidden.value = '';
            }

            filterClientePrePedidoDropdown();
        }

        function handleClientePrePedidoBlur() {
            window.setTimeout(() => {
                const input = document.getElementById('select-cliente-busca');
                const hidden = document.getElementById('select-cliente');
                const selected = getClientePrePedidoById(hidden?.value);

                if (!input || !hidden) {
                    return;
                }

                if (!input.value.trim()) {
                    input.value = selected ? getClientePrePedidoLabel(selected) : (input.dataset.previousLabel || '');
                }

                delete input.dataset.previousLabel;
                closeClientePrePedidoDropdown();
            }, 150);
        }

        function filterClientePrePedidoDropdown(forceShowAll = false) {
            const input = document.getElementById('select-cliente-busca');
            const hidden = document.getElementById('select-cliente');
            const dropdown = document.getElementById('select-cliente-dropdown');
            const selected = getClientePrePedidoById(hidden?.value);
            const selectedLabel = selected ? getClientePrePedidoLabel(selected) : '';

            if (!input || !dropdown) {
                return;
            }

            const termo = forceShowAll || normalizeClientePrePedidoText(input.value) === normalizeClientePrePedidoText(selectedLabel)
                ? ''
                : normalizeClientePrePedidoText(input.value);

            const botoes = dropdown.querySelectorAll('button[data-cliente-opcao]');
            let encontrou = false;

            botoes.forEach(botao => {
                const textoBusca = `${botao.dataset.label || ''} ${botao.dataset.search || ''}`.toLowerCase();
                const visible = !termo || textoBusca.includes(termo);
                botao.style.display = visible ? '' : 'none';
                if (visible) {
                    encontrou = true;
                }
            });

            let emptyState = dropdown.querySelector('[data-cliente-empty-state]');
            if (!emptyState) {
                emptyState = document.createElement('div');
                emptyState.dataset.clienteEmptyState = 'true';
                emptyState.className = 'px-3 py-3 text-sm text-gray-500';
                emptyState.textContent = 'Nenhum cliente encontrado para a pesquisa.';
                dropdown.appendChild(emptyState);
            }

            emptyState.style.display = encontrou ? 'none' : '';
            dropdown.classList.remove('hidden');
        }

        function selecionarClientePrePedido(clienteId) {
            const input = document.getElementById('select-cliente-busca');
            const hidden = document.getElementById('select-cliente');
            const cliente = getClientePrePedidoById(clienteId);

            if (!input || !hidden || !cliente) {
                return;
            }

            hidden.value = cliente.id;
            input.value = getClientePrePedidoLabel(cliente);
            delete input.dataset.previousLabel;
            closeClientePrePedidoDropdown();
        }

        document.addEventListener('click', (event) => {
            const container = event.target.closest('[id^="pre-item-produto-"]');
            const wrapper = event.target.closest('.relative');

            if (container || wrapper?.querySelector?.('[id^="pre-item-produto-dropdown-"]')) {
                return;
            }

            closeAllProdutoPrePedidoDropdowns();
            closeClientePrePedidoDropdown();
        });

        async function excluirItemPrePedidoAnalise(itemId) {
            if (!confirm('Deseja remover este item do pré-pedido?')) {
                return;
            }

            try {
                showLoading(true);
                await removerItemPrePedido(itemId);
                await analisarPrePedido(prePedidoEmAnaliseId);
                await carregarPrePedidos();
                showToast('Item removido do pré-pedido com sucesso!', 'success');
            } catch (error) {
                handleError(error, 'Erro ao remover item do pré-pedido');
            } finally {
                showLoading(false);
            }
        }

        function abrirModalRejeitar(id) {
            document.getElementById('rejeitar-id').value = id;
            document.getElementById('modal-rejeitar').classList.remove('hidden');
        }

        function fecharModalRejeitar() {
            document.getElementById('modal-rejeitar').classList.add('hidden');
            document.getElementById('form-rejeitar').reset();
        }

        async function confirmarRejeicao(event) {
            event.preventDefault();
            
            const id = document.getElementById('rejeitar-id').value;
            const motivo = document.getElementById('motivo-rejeicao').value;

            try {
                showLoading(true);
                await rejeitarPrePedido(id, motivo);
                showLoading(false);
                
                showToast('Pré-pedido rejeitado', 'success');
                fecharModalRejeitar();
                await carregarPrePedidos();
            } catch (error) {
                showLoading(false);
                handleError(error, 'Erro ao rejeitar pré-pedido');
            }
        }

        async function reativarPrePedidoExpirado(id) {
            if (!confirm('Reativar este pré-pedido por mais 48 horas?')) {
                return;
            }

            try {
                showLoading(true);
                await reativarPrePedido(id);
                showLoading(false);

                showToast('Pré-pedido reativado com sucesso', 'success');
                await carregarPrePedidos();
            } catch (error) {
                showLoading(false);
                handleError(error, 'Erro ao reativar pré-pedido');
            }
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        async function gerarPedidoVendaModal(prePedidoId) {
            const clienteId = document.getElementById('select-cliente').value
                || resolveClientePrePedidoOption(document.getElementById('select-cliente-busca')?.value)?.id;
            
            if (!clienteId) {
                alert('Selecione um cliente');
                return;
            }

            if (!confirm('Confirma a geração do pedido de venda?')) {
                return;
            }

            try {
                showLoading(true);
                
                // Buscar validação de estoque
                const validacao = await validarEstoquePrePedido(prePedidoId);
                const prePedido = await obterPrePedido(prePedidoId);
                
                // Montar observações sobre problemas de estoque
                let observacoesEstoque = '';
                if (!validacao.valido) {
                    const itensComProblema = validacao.validacoes.filter(v => v.status === 'INSUFICIENTE');
                    if (itensComProblema.length > 0) {
                        observacoesEstoque = '\n\n⚠️ ATENÇÃO - ESTOQUE INSUFICIENTE NO MOMENTO DA GERAÇÃO:\n';
                        itensComProblema.forEach(item => {
                            observacoesEstoque += `\n• ${item.produto_nome}`;
                            if (item.sabor_nome) observacoesEstoque += ` (${item.sabor_nome})`;
                            observacoesEstoque += `: Solicitado ${item.quantidade_solicitada}, Disponível ${item.estoque_atual}`;
                        });
                        observacoesEstoque += '\n\nPor favor, verificar disponibilidade e ajustar o pedido conforme necessário.';
                    }
                }
                
                const resultado = await gerarPedidoVenda(prePedidoId, clienteId, observacoesEstoque);
                
                showLoading(false);
                showToast('Pedido de venda criado com sucesso!', 'success');
                
                fecharModalAnalise();
                await carregarPrePedidos();
                
                // Redirecionar para o pedido criado
                if (confirm('Deseja abrir o pedido criado?')) {
                    window.location.href = `/pages/venda-detalhe.html?id=${resultado.pedido.id}`;
                }
            } catch (error) {
                showLoading(false);
                handleError(error, 'Erro ao gerar pedido de venda');
            }
        }
    </script>
</body>
</html>
