<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria - Sistema de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="lg:ml-64 pt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Cabeçalho -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h1 class="text-2xl font-bold text-gray-800">🔍 Auditoria</h1>
                <p class="text-gray-600 mt-1">
                    Todas as criações, edições e exclusões em Pedidos, Itens de Pedido e Pré-Pedidos — quem fez, quando e o que mudou.
                    Visível apenas para ADMIN.
                </p>
            </div>

            <!-- Filtros -->
            <div class="bg-white rounded-lg shadow-md p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tabela</label>
                        <select id="filtro-tabela" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                            <option value="">Todas</option>
                            <option value="pedidos">Pedidos</option>
                            <option value="pedido_itens">Itens de Pedido</option>
                            <option value="pre_pedidos">Pré-Pedidos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ação</label>
                        <select id="filtro-acao" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                            <option value="">Todas</option>
                            <option value="INSERT">Criação</option>
                            <option value="UPDATE">Edição</option>
                            <option value="DELETE">Exclusão</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
                        <input type="text" id="filtro-usuario" placeholder="Nome do usuário..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data Início</label>
                        <input type="date" id="filtro-data-inicio" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data Fim</label>
                        <input type="date" id="filtro-data-fim" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="mt-4 flex gap-2">
                    <button onclick="recarregarAuditoria()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        <i class="fas fa-search mr-2"></i>Buscar
                    </button>
                    <button onclick="limparFiltrosAuditoria()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">
                        Limpar
                    </button>
                </div>
            </div>

            <!-- Tabela -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data/Hora</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usuário</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tabela</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ação</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Resumo</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Detalhes</th>
                            </tr>
                        </thead>
                        <tbody id="auditoria-tbody" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                                    <p>Carregando auditoria...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-4 text-center border-t">
                    <button id="btn-carregar-mais" onclick="carregarMaisAuditoria()" class="hidden px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200">
                        Carregar mais
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Detalhes -->
    <div id="modal-detalhe-auditoria" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-3xl w-full max-h-[85vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-lg font-semibold">Detalhes da Alteração</h3>
                <button onclick="fecharModalDetalheAuditoria()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <div id="modal-detalhe-auditoria-corpo" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/session-manager.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/sidebar.js"></script>

    <script>
        const PAGE_SIZE = 50;
        let paginaAtual = 0;
        let registrosAuditoria = [];

        const ACAO_LABEL = {
            INSERT: '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">Criação</span>',
            UPDATE: '<span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">Edição</span>',
            DELETE: '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">Exclusão</span>'
        };

        const TABELA_LABEL = {
            pedidos: 'Pedidos',
            pedido_itens: 'Itens de Pedido',
            pre_pedidos: 'Pré-Pedidos'
        };

        function montarQueryAuditoria() {
            const tabela = document.getElementById('filtro-tabela').value;
            const acao = document.getElementById('filtro-acao').value;
            const usuario = document.getElementById('filtro-usuario').value.trim();
            const dataInicio = document.getElementById('filtro-data-inicio').value;
            const dataFim = document.getElementById('filtro-data-fim').value;

            let query = supabase
                .from('audit_log')
                .select('*')
                .order('created_at', { ascending: false });

            if (tabela) query = query.eq('tabela', tabela);
            if (acao) query = query.eq('acao', acao);
            if (usuario) query = query.ilike('usuario_nome', `%${usuario}%`);
            if (dataInicio) query = query.gte('created_at', new Date(dataInicio + 'T00:00:00').toISOString());
            if (dataFim) query = query.lte('created_at', new Date(dataFim + 'T23:59:59').toISOString());

            return query;
        }

        async function recarregarAuditoria() {
            paginaAtual = 0;
            registrosAuditoria = [];
            const tbody = document.getElementById('auditoria-tbody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                        <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                        <p>Carregando auditoria...</p>
                    </td>
                </tr>
            `;
            await buscarPaginaAuditoria();
        }

        async function carregarMaisAuditoria() {
            paginaAtual++;
            await buscarPaginaAuditoria();
        }

        async function buscarPaginaAuditoria() {
            try {
                const from = paginaAtual * PAGE_SIZE;
                const to = from + PAGE_SIZE - 1;
                const { data, error } = await montarQueryAuditoria().range(from, to);
                if (error) throw error;

                registrosAuditoria = registrosAuditoria.concat(data || []);
                renderAuditoria(registrosAuditoria);

                document.getElementById('btn-carregar-mais').classList.toggle('hidden', (data || []).length < PAGE_SIZE);
            } catch (error) {
                console.error('Erro ao carregar auditoria:', error);
                document.getElementById('auditoria-tbody').innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-red-500">
                            Erro ao carregar auditoria: ${error.message || 'tente novamente'}.
                        </td>
                    </tr>
                `;
            }
        }

        function limparFiltrosAuditoria() {
            document.getElementById('filtro-tabela').value = '';
            document.getElementById('filtro-acao').value = '';
            document.getElementById('filtro-usuario').value = '';
            document.getElementById('filtro-data-inicio').value = '';
            document.getElementById('filtro-data-fim').value = '';
            recarregarAuditoria();
        }

        // Monta um resumo legível das mudanças (para UPDATE, mostra só os campos que mudaram)
        function resumoRegistro(registro) {
            if (registro.acao === 'INSERT') {
                return 'Registro criado';
            }
            if (registro.acao === 'DELETE') {
                return 'Registro excluído';
            }
            // UPDATE: comparar dados_anteriores x dados_novos
            const antes = registro.dados_anteriores || {};
            const depois = registro.dados_novos || {};
            const camposIgnorados = new Set(['updated_at']);
            const alterados = Object.keys(depois).filter(k => {
                if (camposIgnorados.has(k)) return false;
                return JSON.stringify(antes[k]) !== JSON.stringify(depois[k]);
            });
            if (alterados.length === 0) return 'Sem alterações relevantes';
            if (alterados.includes('deleted_at') && !antes.deleted_at && depois.deleted_at) {
                return '🗑️ Pedido excluído (exclusão lógica)';
            }
            return `Campos alterados: ${alterados.slice(0, 4).join(', ')}${alterados.length > 4 ? '…' : ''}`;
        }

        function renderAuditoria(registros) {
            const tbody = document.getElementById('auditoria-tbody');

            if (registros.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                            <p>Nenhum registro de auditoria encontrado para esses filtros.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = registros.map((r, idx) => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(r.created_at)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                        ${r.usuario_nome || '<span class="text-gray-400 italic">desconhecido</span>'}
                        ${r.usuario_role ? `<span class="block text-xs text-gray-400">${r.usuario_role}</span>` : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${TABELA_LABEL[r.tabela] || r.tabela}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${ACAO_LABEL[r.acao] || r.acao}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${resumoRegistro(r)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm">
                        <button onclick="abrirModalDetalheAuditoria(${idx})" class="text-blue-600 hover:text-blue-800">Ver JSON</button>
                    </td>
                </tr>
            `).join('');
        }

        function abrirModalDetalheAuditoria(idx) {
            const r = registrosAuditoria[idx];
            const corpo = document.getElementById('modal-detalhe-auditoria-corpo');
            corpo.innerHTML = `
                <div class="space-y-4 text-sm">
                    <div><span class="font-semibold">Tabela:</span> ${TABELA_LABEL[r.tabela] || r.tabela}</div>
                    <div><span class="font-semibold">Registro (ID):</span> <code class="text-xs">${r.registro_id || '-'}</code></div>
                    <div><span class="font-semibold">Ação:</span> ${ACAO_LABEL[r.acao] || r.acao}</div>
                    <div><span class="font-semibold">Usuário:</span> ${r.usuario_nome || 'desconhecido'} (${r.usuario_role || '-'})</div>
                    <div><span class="font-semibold">Data/Hora:</span> ${formatDate(r.created_at)}</div>
                    ${r.dados_anteriores ? `
                        <div>
                            <p class="font-semibold mb-1">Antes:</p>
                            <pre class="bg-gray-50 border rounded p-3 text-xs overflow-x-auto">${JSON.stringify(r.dados_anteriores, null, 2)}</pre>
                        </div>
                    ` : ''}
                    ${r.dados_novos ? `
                        <div>
                            <p class="font-semibold mb-1">Depois:</p>
                            <pre class="bg-gray-50 border rounded p-3 text-xs overflow-x-auto">${JSON.stringify(r.dados_novos, null, 2)}</pre>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('modal-detalhe-auditoria').classList.remove('hidden');
            document.getElementById('modal-detalhe-auditoria').classList.add('flex');
        }

        function fecharModalDetalheAuditoria() {
            document.getElementById('modal-detalhe-auditoria').classList.add('hidden');
            document.getElementById('modal-detalhe-auditoria').classList.remove('flex');
        }

        // Inicialização
        (async () => {
            await checkAuth();
            const currentUser = await getCurrentUser();

            // Somente ADMIN acessa a auditoria
            if (currentUser?.role !== 'ADMIN') {
                window.location.href = '/pages/dashboard.html';
                return;
            }

            document.getElementById('navbar-container').innerHTML = createNavbar();
            document.getElementById('sidebar-container').innerHTML = createSidebar();
            await initNavbar();
            await initSidebar();
            recarregarAuditoria();
        })();
    </script>
</body>
</html>
